# Role: portfolio-web 네임스페이스에서 Deployment 조회 권한
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jenkins-deployment-reader
  namespace: portfolio-web
rules:
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments/status"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["get", "list"]

---
# RoleBinding: jenkins ServiceAccount에 Role 바인딩
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-deployment-reader-binding
  namespace: portfolio-web
subjects:
- kind: ServiceAccount
  name: jenkins
  namespace: jenkins # jenkins는 jenkins 네임스페이스에 있음
roleRef:
  kind: Role
  name: jenkins-deployment-reader
  apiGroup: rbac.authorization.k8s.io
