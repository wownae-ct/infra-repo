apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: loki-vs
  namespace: monitoring
spec:
  hosts:
  - "loki.internal"
  gateways:
  - istio-system/internal-gateway
  http:
  - route:
    - destination:
        host: loki.monitoring.svc.cluster.local
        port:
          number: 3100
