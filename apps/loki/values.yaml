# Loki subchart values
# 기존 loki-values.yaml 내용을 loki: 아래에 네스팅
loki:
  deploymentMode: SingleBinary
  loki:
    auth_enabled: false
    commonConfig:
      replication_factor: 1
    storage:
      type: filesystem
    schemaConfig:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    limits_config:
      retention_period: 72h
      reject_old_samples: false
      reject_old_samples_max_age: 168h
    compactor:
      retention_enabled: true
      delete_request_store: filesystem
  singleBinary:
    replicas: 1
    persistence:
      enabled: true
      storageClass: longhorn
      size: 10Gi
    podAnnotations:
      volume.longhorn.io/number-of-replicas: "1"
  read:
    replicas: 0
  write:
    replicas: 0
  backend:
    replicas: 0
  monitoring:
    selfMonitoring:
      enabled: false
      grafanaAgent:
        installOperator: false
    serviceMonitor:
      enabled: false
  test:
    enabled: false
  gateway:
    enabled: false
  chunksCache:
    enabled: false
  resultsCache:
    enabled: false
  lokiCanary:
      enabled: false

