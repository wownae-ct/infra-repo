apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jenkins
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.io
spec:
  ignoreDifferences:
  - group: ""
    kind: Secret
    name: jenkins
    jsonPointers:
    - /data
  project: default
  sources:
    - repoURL: https://charts.jenkins.io
      chart: jenkins
      targetRevision: 5.9.9
      helm:
        valueFiles:
          - $values/apps/jenkins/templates/jenkins-values.yaml
    - repoURL: git@github.com:wownae-ct/infra-repo.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: jenkins
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
