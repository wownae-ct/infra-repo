---
# ============================================================
# ECR credentials refresh 부트스트랩
# ============================================================
# 대상: k8s-master-01 (install + verify)
#
# 사전 조건:
#   - 14차 (App-of-Apps) 까지 완료
#   - vault 변수: vault_aws_access_key, vault_aws_secret_key (13차 등록분 재사용)
#   - portfolio-web namespace (ArgoCD 가 생성했거나 install 단계에서 보장)
#
# Sub-task 순서:
#   1. install — namespace + AWS creds + RBAC + CronJob + 초기 1회 Job
#   2. verify  — CronJob / RBAC / Secret / Deployment 참조 검증
#
# 결과:
#   - 6시간마다 ecr-credentials Secret 자동 갱신
#   - portfolio-web Pod 가 외부 재시작돼도 ECR token 만료로 인한
#     ImagePullBackOff 방지
# ============================================================

- name: "ecr-credentials-refresh | install + verify"
  hosts: k8s-master-01
  become: true
  gather_facts: true
  any_errors_fatal: true

  tasks:
    - name: "1) install (Secret + RBAC + CronJob + initial Job)"
      ansible.builtin.include_role:
        name: ecr-credentials-refresh
      vars:
        ecr_sub_task: install

    - name: "2) verify"
      ansible.builtin.include_role:
        name: ecr-credentials-refresh
      vars:
        ecr_sub_task: verify
