---
# ============================================================
# Phase 5a — k8s 노드 공통 준비
# ============================================================
# 대상: k8s_cluster (masters + workers, 6대)
#
# 사양표 sub-task #1, #2, #3 을 하나의 play 에 묶음.
# 세 단계가 순차 의존 (common → containerd → kube_packages) 이지만
# 한 노드 안에서 끝나면 되므로 노드별 병렬 실행 OK.
#
# 후속:
#   06-k8s-ha.yml         (5b — keepalived + haproxy)
#   07-k8s-bootstrap.yml  (5c — kubeadm init)
#   ...
# ============================================================

- name: "Phase 5a | k8s common preparation"
  hosts: k8s_cluster
  become: true
  gather_facts: true
  any_errors_fatal: true

  tasks:
    - name: "5a.1 → common (swap/modules/sysctl)"
      ansible.builtin.include_role:
        name: k8s
      vars:
        k8s_sub_task: common

    - name: "5a.2 → containerd (apt + config.toml + SystemdCgroup=true)"
      ansible.builtin.include_role:
        name: k8s
      vars:
        k8s_sub_task: containerd

    - name: "5a.3 → kube_packages (kubelet/kubeadm/kubectl 1.34.8 + hold)"
      ansible.builtin.include_role:
        name: k8s
      vars:
        k8s_sub_task: kube_packages
