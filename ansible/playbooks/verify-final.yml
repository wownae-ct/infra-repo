---
# Phase 5 — 최종 E2E 검증 플레이북
# 기존 verify-phase.yml (25개 인프라 검증) 통과 후 실행
#
# 실행:
#   전체:       ansible-playbook -i inventories/hyperv/hosts.ini playbooks/verify-final.yml --ask-vault-pass
#   장애 시나리오만: ansible-playbook -i inventories/hyperv/hosts.ini playbooks/verify-final.yml --ask-vault-pass --tags resilience
#   모니터링만:    ansible-playbook -i inventories/hyperv/hosts.ini playbooks/verify-final.yml --ask-vault-pass --tags monitoring

###############################################################################
# PLAY 1 — bastion: WireGuard 터널 + TLS 인증서 + 외부 경로 검증
###############################################################################
- name: "PLAY 1 | 외부 접속 경로 검증 (bastion)"
  hosts: bastion
  gather_facts: false
  tags: [external]

  tasks:
    - name: "WireGuard | 터널 상태"
      ansible.builtin.command: wg show wg0
      register: r_wg
      changed_when: false
      become: true

    - name: "WireGuard | latest handshake 확인"
      ansible.builtin.shell: |
        wg show wg0 latest-handshakes | awk '{print $2}'
      register: r_wg_handshake
      changed_when: false
      become: true

    - name: "WireGuard | handshake 경과 시간 (초)"
      ansible.builtin.shell: |
        HS=$(wg show wg0 latest-handshakes | awk '{print $2}')
        if [ "$HS" = "0" ]; then echo "999999"; else echo $(( $(date +%s) - HS )); fi
      register: r_wg_age
      changed_when: false
      become: true

    - name: "WireGuard | 결과"
      ansible.builtin.debug:
        msg:
          - "handshake 경과: {{ r_wg_age.stdout }}초"
          - "상태: {{ (r_wg_age.stdout | int < 180) | ternary('✅ 최근 handshake (3분 이내)', '⚠️ handshake ' + r_wg_age.stdout + '초 전') }}"

    - name: "WireGuard | EC2 ping (5회)"
      ansible.builtin.command: ping -c 5 -W 2 10.99.1.1
      register: r_wg_ping
      changed_when: false
      ignore_errors: true

    - name: "WireGuard | ping 결과"
      ansible.builtin.debug:
        msg: "EC2 ping : {{ (r_wg_ping.rc == 0) | ternary('✅ ' + (r_wg_ping.stdout_lines | last | default('')), '❌ FAIL') }}"

    - name: "TLS | 인증서 만료일 확인 (example.ddns.net)"
      ansible.builtin.shell: |
        echo | openssl s_client -servername example.ddns.net -connect 127.0.0.1:443 2>/dev/null \
          | openssl x509 -noout -dates -subject 2>/dev/null
      register: r_tls
      changed_when: false
      ignore_errors: true

    - name: "TLS | 잔여일 계산"
      ansible.builtin.shell: |
        EXPIRY=$(echo | openssl s_client -servername example.ddns.net -connect 127.0.0.1:443 2>/dev/null \
          | openssl x509 -noout -enddate 2>/dev/null | cut -d= -f2)
        if [ -n "$EXPIRY" ]; then
          echo $(( ($(date -d "$EXPIRY" +%s) - $(date +%s)) / 86400 ))
        else
          echo "ERR"
        fi
      register: r_tls_days
      changed_when: false
      ignore_errors: true

    - name: "TLS | 결과"
      ansible.builtin.debug:
        msg:
          - "{{ r_tls.stdout_lines | default(['❌ 인증서 조회 실패']) }}"
          - "잔여일: {{ r_tls_days.stdout | default('ERR') }}일 {{ (r_tls_days.stdout | default('0') | int > 14) | ternary('✅', '⚠️ 갱신 필요') }}"

    - name: "TLS | s3.example.ddns.net 인증서 확인"
      ansible.builtin.shell: |
        echo | openssl s_client -servername s3.example.ddns.net -connect 127.0.0.1:443 2>/dev/null \
          | openssl x509 -noout -dates -subject 2>/dev/null
      register: r_tls_s3
      changed_when: false
      ignore_errors: true

    - name: "TLS | s3 결과"
      ansible.builtin.debug:
        msg: "{{ r_tls_s3.stdout_lines | default(['❌ s3 인증서 조회 실패']) }}"

    - name: "Nginx | external vhost 활성화 확인"
      ansible.builtin.shell: |
        nginx -T 2>/dev/null | grep -c 'server_name.*example.ddns.net'
      register: r_nginx_ext
      changed_when: false
      ignore_errors: true
      become: true

    - name: "Nginx | external 결과"
      ansible.builtin.debug:
        msg: "external vhost: {{ (r_nginx_ext.stdout | default('0') | int > 0) | ternary('✅ 활성화됨', '❌ 미활성화') }}"

    # [FIX] iptables → UFW 체크로 변경 (bastion은 UFW 관리)
    - name: "UFW | 80/443 ACCEPT 확인"
      ansible.builtin.shell: |
        ufw status | grep -E '(80|443).*ALLOW' | head -4
      register: r_ufw_ext
      changed_when: false
      ignore_errors: true
      become: true

    - name: "UFW | 결과"
      ansible.builtin.debug:
        msg: "{{ r_ufw_ext.stdout_lines | default(['❌ 80/443 ALLOW 룰 없음']) }}"

    - name: "PLAY 1 | 요약"
      ansible.builtin.debug:
        msg:
          - "=== 외부 접속 경로 요약 ==="
          - "WireGuard : {{ (r_wg_ping.rc == 0) | ternary('✅ EC2 연결 정상', '❌ EC2 연결 실패') }}"
          - "TLS 잔여  : {{ r_tls_days.stdout | default('?') }}일"
          - "Nginx ext : {{ (r_nginx_ext.stdout | default('0') | int > 0) | ternary('✅', '❌') }}"
          - "UFW 80/443: {{ (r_ufw_ext.stdout | default('') | length > 0) | ternary('✅ ALLOW', '❌') }}"

###############################################################################
# PLAY 2 — k8s: portfolio-web 앱 레벨 검증
###############################################################################
- name: "PLAY 2 | portfolio-web 앱 검증 (k8s-master-01)"
  hosts: k8s-master-01
  gather_facts: false
  tags: [app]

  tasks:
    - name: "portfolio-web | pod 상태"
      ansible.builtin.shell: |
        kubectl -n portfolio-web get pods -o wide --no-headers
      register: r_pw_pods
      changed_when: false

    - name: "portfolio-web | pod 결과"
      ansible.builtin.debug:
        msg: "{{ r_pw_pods.stdout_lines }}"

    # [FIX] portfolio-web deploy pod만 필터 (CronJob pod 이름 숫자 매칭 방지)
    - name: "portfolio-web | RESTARTS 수 확인"
      ansible.builtin.shell: |
        kubectl -n portfolio-web get pods -l app=portfolio-web --no-headers \
          -o custom-columns='NAME:.metadata.name,RESTARTS:.status.containerStatuses[0].restartCount'
      register: r_pw_restarts
      changed_when: false

    - name: "portfolio-web | RESTARTS 최대값 추출"
      ansible.builtin.set_fact:
        pw_max_restarts: >-
          {{ r_pw_restarts.stdout_lines
             | map('regex_search', '\s+(\d+)$', '\1')
             | select('ne', None)
             | map('first')
             | map('int')
             | max | default(0) }}

    - name: "portfolio-web | RESTARTS 판정"
      ansible.builtin.debug:
        msg: "{{ r_pw_restarts.stdout_lines }} — 최대 RESTARTS={{ pw_max_restarts }} {{ (pw_max_restarts | int == 0) | ternary('✅', '⚠️ 재시작 발생') }}"

    - name: "portfolio-web | /health 엔드포인트"
      ansible.builtin.uri:
        url: "http://example.ddns.net/health"
        validate_certs: false
        timeout: 10
        status_code: [200]
      register: r_pw_health
      ignore_errors: true

    - name: "portfolio-web | /health 결과"
      ansible.builtin.debug:
        msg: "/health : {{ (r_pw_health.status | default(0) == 200) | ternary('✅ 200 OK', '❌ ' + (r_pw_health.status | default('ERR') | string)) }}"

    - name: "portfolio-web | DB 연결 확인 (최근 로그에서 에러 체크)"
      ansible.builtin.shell: |
        kubectl -n portfolio-web logs --tail=50 -l app=portfolio-web 2>/dev/null \
          | grep -ic 'error\|exception\|refused\|timeout' || echo "0"
      register: r_pw_errors
      changed_when: false
      ignore_errors: true

    - name: "portfolio-web | 에러 로그 결과"
      ansible.builtin.debug:
        msg: "최근 50줄 에러 수: {{ r_pw_errors.stdout }} {{ (r_pw_errors.stdout | int == 0) | ternary('✅', '⚠️ 에러 로그 존재 — kubectl logs 확인 필요') }}"

    # [FIX] MinIO — 직접 IP로 health 체크 (s3.lab.internal은 k8s에서 해석 불가)
    - name: "portfolio-web | MinIO health (storage 직접)"
      ansible.builtin.uri:
        url: "http://10.98.1.232:9000/minio/health/live"
        validate_certs: false
        timeout: 5
        status_code: [200]
      register: r_pw_minio
      ignore_errors: true

    # MinIO 앱 credential 검증 (InvalidAccessKeyId 방지)
    - name: "portfolio-web | MinIO 앱 credential 검증"
      ansible.builtin.shell: |
        kubectl -n portfolio-web logs -l app=portfolio-web --tail=100 \
          | grep -c 'InvalidAccessKeyId' || echo "0"
      register: r_pw_minio_auth
      changed_when: false
      ignore_errors: true

    - name: "portfolio-web | MinIO credential 결과"
      ansible.builtin.debug:
        msg: "MinIO credential: {{ (r_pw_minio_auth.stdout | int == 0) | ternary('✅ 인증 정상', '❌ InvalidAccessKeyId ' + r_pw_minio_auth.stdout + '건 — storage role mc 유저 확인 필요') }}"

    - name: "portfolio-web | MinIO 결과"
      ansible.builtin.debug:
        msg: "MinIO (10.98.1.232:9000): {{ (r_pw_minio.status | default(0) == 200) | ternary('✅ 200 OK', '❌ FAIL') }}"

    - name: "portfolio-web | MariaDB 외부 접속 (Service/Endpoints 확인)"
      ansible.builtin.shell: |
        kubectl -n portfolio-web get endpoints mariadb-external \
          -o jsonpath='{.subsets[0].addresses[0].ip}:{.subsets[0].ports[0].port}' 2>/dev/null || echo ""
      register: r_pw_db_ep
      changed_when: false
      ignore_errors: true

    - name: "portfolio-web | MariaDB Endpoints 결과"
      ansible.builtin.debug:
        msg: "mariadb-external endpoint: {{ r_pw_db_ep.stdout | default('❌ 없음') }} {{ (r_pw_db_ep.stdout | default('') | length > 0) | ternary('✅', '❌') }}"

    - name: "portfolio-web | 이미지 태그 (현재 배포 버전)"
      ansible.builtin.shell: |
        kubectl -n portfolio-web get deploy portfolio-web \
          -o jsonpath='{.spec.template.spec.containers[0].image}'
      register: r_pw_image
      changed_when: false

    - name: "portfolio-web | 배포 버전"
      ansible.builtin.debug:
        msg: "현재 이미지: {{ r_pw_image.stdout }}"

    - name: "PLAY 2 | 요약"
      ansible.builtin.debug:
        msg:
          - "=== portfolio-web 요약 ==="
          - "Pod       : {{ ('Running' in r_pw_pods.stdout) | ternary('✅ Running', '❌') }}"
          - "RESTARTS  : {{ (pw_max_restarts | int == 0) | ternary('✅ 0', '⚠️ ' + pw_max_restarts | string) }}"
          - "/health   : {{ (r_pw_health.status | default(0) == 200) | ternary('✅', '❌') }}"
          - "에러 로그  : {{ (r_pw_errors.stdout | int == 0) | ternary('✅ 없음', '⚠️ ' + r_pw_errors.stdout + '건') }}"
          - "MinIO     : {{ (r_pw_minio.status | default(0) == 200) | ternary('✅', '❌') }}"
          - "MinIO auth: {{ (r_pw_minio_auth.stdout | int == 0) | ternary('✅', '❌ InvalidAccessKeyId') }}"
          - "DB EP     : {{ r_pw_db_ep.stdout | default('❌') }}"
          - "Image     : {{ r_pw_image.stdout | default('?') }}"

###############################################################################
# PLAY 3 — 장애 시나리오 테스트 (--tags resilience)
###############################################################################
- name: "PLAY 3 | 장애 시나리오 테스트 (k8s-master-01)"
  hosts: k8s-master-01
  gather_facts: false
  tags: [resilience, never]

  tasks:
    - name: "========== 3-1. Pod 강제 삭제 → 자동 복구 =========="
      ansible.builtin.debug:
        msg: "portfolio-web pod 강제 삭제 시작"

    - name: "Pod 삭제 전 | 현재 pod 이름 기록"
      ansible.builtin.shell: |
        kubectl -n portfolio-web get pods -l app=portfolio-web --no-headers -o custom-columns=':metadata.name'
      register: r_pod_before
      changed_when: false

    - name: "Pod 삭제 전 | pod"
      ansible.builtin.debug:
        msg: "삭제 대상: {{ r_pod_before.stdout_lines }}"

    - name: "Pod 삭제 | kubectl delete pod"
      ansible.builtin.shell: |
        kubectl -n portfolio-web delete pod -l app=portfolio-web --force --grace-period=0

    - name: "Pod 복구 대기 | 30초"
      ansible.builtin.pause:
        seconds: 30

    - name: "Pod 복구 확인 | 새 pod Running 확인"
      ansible.builtin.shell: |
        kubectl -n portfolio-web get pods -l app=portfolio-web --no-headers
      register: r_pod_after
      changed_when: false

    - name: "Pod 복구 | 결과"
      ansible.builtin.debug:
        msg:
          - "삭제 전: {{ r_pod_before.stdout_lines }}"
          - "삭제 후: {{ r_pod_after.stdout_lines }}"
          - "{{ ('Running' in r_pod_after.stdout) | ternary('✅ 자동 복구 성공', '❌ 복구 실패 — 수동 확인 필요') }}"

    - name: "Pod 복구 | /health 재확인"
      ansible.builtin.uri:
        url: "http://example.ddns.net/health"
        validate_certs: false
        timeout: 15
        status_code: [200]
      register: r_pod_health
      ignore_errors: true
      retries: 3
      delay: 10
      until: r_pod_health.status == 200

    - name: "Pod 복구 | /health 결과"
      ansible.builtin.debug:
        msg: "/health after restart: {{ (r_pod_health.status | default(0) == 200) | ternary('✅ 200 OK', '❌ FAIL') }}"

    - name: "========== 3-2. ArgoCD 강제 sync 테스트 =========="
      ansible.builtin.debug:
        msg: "ArgoCD OutOfSync → sync 복구 테스트"

    - name: "ArgoCD | portfolio-web 앱에 dummy annotation 추가 (OutOfSync 유발)"
      ansible.builtin.shell: |
        kubectl -n portfolio-web annotate deploy portfolio-web \
          e2e-test-timestamp="{{ lookup('pipe', 'date +%s') }}" --overwrite
      changed_when: true

    - name: "ArgoCD | 10초 대기"
      ansible.builtin.pause:
        seconds: 10

    - name: "ArgoCD | portfolio-web sync 상태"
      ansible.builtin.shell: |
        kubectl -n argocd get application portfolio-web \
          -o jsonpath='{.status.sync.status}'
      register: r_argo_sync_before
      changed_when: false

    - name: "ArgoCD | 현재 상태"
      ansible.builtin.debug:
        msg: "sync 상태: {{ r_argo_sync_before.stdout }} {{ (r_argo_sync_before.stdout == 'OutOfSync') | ternary('✅ OutOfSync 정상 감지', '⚠️ 아직 Synced — ArgoCD refresh 필요할 수 있음') }}"

    - name: "ArgoCD | hard refresh + sync"
      ansible.builtin.shell: |
        kubectl -n argocd patch application portfolio-web --type merge \
          -p '{"operation":{"sync":{"prune":false,"dryRun":false},"initiatedBy":{"username":"e2e-test"}}}'
      changed_when: true
      ignore_errors: true

    - name: "ArgoCD | sync 복구 대기 30초"
      ansible.builtin.pause:
        seconds: 30

    - name: "ArgoCD | sync 복구 확인"
      ansible.builtin.shell: |
        kubectl -n argocd get application portfolio-web \
          -o jsonpath='{.metadata.name}{" sync="}{.status.sync.status}{" health="}{.status.health.status}'
      register: r_argo_sync_after
      changed_when: false

    - name: "ArgoCD | 복구 결과"
      ansible.builtin.debug:
        msg: "{{ r_argo_sync_after.stdout }} {{ ('Synced' in r_argo_sync_after.stdout and 'Healthy' in r_argo_sync_after.stdout) | ternary('✅ 복구 완료', '⚠️ 아직 복구 중 — 수동 확인') }}"

    - name: "========== 3-3. Longhorn 볼륨 healthy 확인 =========="
      ansible.builtin.debug:
        msg: "Longhorn 볼륨 상태 확인 (drain은 수동 테스트)"

    - name: "Longhorn | 볼륨 상태"
      ansible.builtin.command: >
        kubectl get volumes.longhorn.io -n longhorn-system
        -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.status.state}{"\t robustness="}{.status.robustness}{"\n"}{end}'
      register: r_lh_vol
      changed_when: false

    - name: "Longhorn | 결과"
      ansible.builtin.debug:
        msg: "{{ r_lh_vol.stdout_lines }}"

    - name: "Longhorn | degraded/faulted 없음 확인"
      ansible.builtin.assert:
        that:
          - "'degraded' not in r_lh_vol.stdout"
          - "'faulted' not in r_lh_vol.stdout"
        fail_msg: "❌ degraded/faulted 볼륨 존재"
        success_msg: "✅ 전체 볼륨 healthy"
      ignore_errors: true

    - name: "PLAY 3 | 요약"
      ansible.builtin.debug:
        msg:
          - "=== 장애 시나리오 요약 ==="
          - "Pod 자동 복구  : {{ ('Running' in r_pod_after.stdout) | ternary('✅', '❌') }}"
          - "ArgoCD sync    : {{ ('Synced' in r_argo_sync_after.stdout | default('')) | ternary('✅', '⚠️') }}"
          - "Longhorn       : {{ ('degraded' not in r_lh_vol.stdout and 'faulted' not in r_lh_vol.stdout) | ternary('✅', '❌') }}"
          - ""
          - "⏭  수동 테스트 필요:"
          - "   - WireGuard 터널 재연결 (EC2에서 wg-quick down/up)"
          - "   - Longhorn drain (kubectl drain worker → 볼륨 healthy 유지 확인)"

###############################################################################
# PLAY 4 — 모니터링 + 알림 최종 검증
###############################################################################
- name: "PLAY 4 | 모니터링 + 알림 검증 (k8s-master-01)"
  hosts: k8s-master-01
  gather_facts: false
  tags: [monitoring]

  tasks:
    - name: "Prometheus | targets 전체 UP"
      ansible.builtin.uri:
        url: "http://prometheus.lab.internal/api/v1/targets"
        validate_certs: false
        timeout: 10
        status_code: 200
      register: r_prom
      ignore_errors: true

    - name: "Prometheus | down targets 추출"
      ansible.builtin.set_fact:
        prom_down: >-
          {{ r_prom.json.data.activeTargets
             | default([])
             | selectattr('health', 'equalto', 'down')
             | map(attribute='labels.job') | list }}
        prom_total: "{{ r_prom.json.data.activeTargets | default([]) | length }}"
        prom_up: >-
          {{ r_prom.json.data.activeTargets
             | default([])
             | selectattr('health', 'equalto', 'up')
             | length }}
      when: r_prom.status is defined and r_prom.status == 200

    - name: "Prometheus | 결과"
      ansible.builtin.debug:
        msg:
          - "targets: {{ prom_up | default('?') }}/{{ prom_total | default('?') }} UP"
          - "down: {{ ((prom_down | default([])) | length == 0) | ternary('✅ 없음', '❌ ' + (prom_down | default([]) | join(', '))) }}"

    - name: "Grafana | 대시보드 목록 + 수"
      ansible.builtin.uri:
        url: "http://grafana.lab.internal/api/search?type=dash-db"
        validate_certs: false
        timeout: 5
        url_username: "admin"
        url_password: "{{ vault_grafana_admin_password }}"
        force_basic_auth: true
        status_code: 200
      register: r_grafana
      ignore_errors: true

    - name: "Grafana | 대시보드 결과"
      ansible.builtin.debug:
        msg: "대시보드 {{ r_grafana.json | default([]) | length }}개: {{ r_grafana.json | default([]) | map(attribute='title') | list }}"

    - name: "Grafana | 최근 메트릭 수집 확인 (up 쿼리)"
      ansible.builtin.uri:
        url: "http://prometheus.lab.internal/api/v1/query?query=up"
        validate_certs: false
        timeout: 10
        status_code: 200
      register: r_prom_up
      ignore_errors: true

    - name: "Grafana | 메트릭 수집 결과"
      ansible.builtin.set_fact:
        metrics_count: "{{ r_prom_up.json.data.result | default([]) | length }}"
      when: r_prom_up.status is defined and r_prom_up.status == 200

    - name: "Grafana | 메트릭 결과"
      ansible.builtin.debug:
        msg: "활성 메트릭 시리즈: {{ metrics_count | default('?') }}개 {{ (metrics_count | default('0') | int > 0) | ternary('✅', '❌ 수집 안 됨') }}"

    - name: "Loki | ready 확인"
      ansible.builtin.uri:
        url: "http://loki.lab.internal/ready"
        validate_certs: false
        timeout: 5
        status_code: 200
      register: r_loki
      ignore_errors: true

    # [FIX] Loki 로그 조회 — shell로 변경 (Jinja 이스케이프 문제 회피)
    - name: "Loki | 최근 로그 존재 확인 (5분 이내)"
      ansible.builtin.shell: |
        START=$(date -u -d "-5 minutes" +%s)
        END=$(date -u +%s)
        curl -s "http://loki.lab.internal/loki/api/v1/query_range" \
          --data-urlencode 'query={namespace="portfolio-web"}' \
          -d "start=${START}" \
          -d "end=${END}" \
          -d "limit=5" \
          -o /dev/null -w "%{http_code}:%{size_download}"
      register: r_loki_logs
      changed_when: false
      ignore_errors: true

    - name: "Loki | 로그 수집 결과"
      ansible.builtin.debug:
        msg:
          - "Loki ready: {{ (r_loki.status | default(0) == 200) | ternary('✅', '❌') }}"
          - "최근 5분 portfolio-web 로그: {{ (r_loki_logs.stdout | default('') is search('^200:') and r_loki_logs.stdout | default(':0') | split(':') | last | int > 50) | ternary('✅ 수집 중', '⚠️ 최근 로그 없음 — Promtail 확인 필요') }}"

    # [FIX] Promtail — namespace: monitoring
    - name: "Promtail | DaemonSet 파드 수 확인"
      ansible.builtin.shell: |
        kubectl -n monitoring get ds promtail \
          -o jsonpath='{.status.desiredNumberScheduled}/{.status.numberReady}'
      register: r_promtail
      changed_when: false
      ignore_errors: true

    - name: "Promtail | 결과"
      ansible.builtin.debug:
        msg: "Promtail DaemonSet: {{ r_promtail.stdout | default('?') }} (desired/ready) {{ (r_promtail.stdout | default('') is search('^(\\d+)/\\1$')) | ternary('✅ 전부 Ready', '⚠️ 일부 미실행') }}"

    - name: "AlertManager | 테스트 알림 발송 (Discord 확인 필요)"
      ansible.builtin.uri:
        url: "http://alertmanager.lab.internal/api/v2/alerts"
        method: POST
        body_format: json
        body:
          - labels:
              alertname: "FinalE2ETest"
              severity: "warning"
            annotations:
              summary: "Phase 5 최종 E2E 검증 테스트 알림"
            startsAt: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"
            endsAt: "{{ lookup('pipe', 'date -u -d \"+2 minutes\" +%Y-%m-%dT%H:%M:%SZ') }}"
        status_code: [200]
        timeout: 5
      register: r_alert
      ignore_errors: true

    - name: "AlertManager | 결과"
      ansible.builtin.debug:
        msg: "테스트 알림: {{ (r_alert.status | default(0) == 200) | ternary('✅ 발송됨 — Discord 채널에서 수신 확인 필요', '❌ 발송 실패') }}"

    - name: "PLAY 4 | 요약"
      ansible.builtin.debug:
        msg:
          - "=== 모니터링 + 알림 요약 ==="
          - "Prometheus : {{ ((prom_down | default([])) | length == 0) | ternary('✅ targets 전부 UP', '❌ down: ' + (prom_down | default([]) | join(', '))) }}"
          - "Grafana    : {{ (r_grafana.json | default([]) | length > 0) | ternary('✅ 대시보드 ' + (r_grafana.json | default([]) | length | string) + '개', '❌') }}"
          - "Loki       : {{ (r_loki.status | default(0) == 200) | ternary('✅ ready', '❌') }}"
          - "Promtail   : {{ r_promtail.stdout | default('?') }}"
          - "AlertManager: {{ (r_alert.status | default(0) == 200) | ternary('✅ 테스트 알림 발송됨', '❌') }}"
          - ""
          - "⏭  수동 확인: Discord 채널에서 FinalE2ETest 알림 수신 확인"

