---
# ============================================================
# Phase 6a — Sealed Secrets controller 부트스트랩
# ============================================================
# 대상: k8s-master-01 (helm 실행 + kubectl 접근 노드)
#
# 사전 조건:
#   - Phase 5f 완료 (6대 노드 Ready)
#   - 백업 sealing key 파일이 control node 에 존재
#     (migration-backup/k8s-cluster/sealed-secrets-key.yaml)
#
# Sub-task 순서:
#   1. restore_key — 백업 sealing key 2개 apply (helm install 이전 필수)
#   2. helm        — chart v2.18.4 install
#   3. verify      — controller Ready + 기존 키 인식 확인
#
# 후속:
#   12-metallb.yml      (6b — MetalLB)
#   13-longhorn.yml     (6c — Longhorn)
#   14-argocd.yml       (6d — ArgoCD)
#   15-argocd-apps.yml  (6e — App-of-Apps takeover)
# ============================================================

- name: "Phase 6a | Sealed Secrets bootstrap"
  hosts: k8s-master-01
  become: true
  gather_facts: true
  any_errors_fatal: true

  tasks:
    - name: "6a.1 → restore_key (백업 sealing key import)"
      ansible.builtin.include_role:
        name: sealed-secrets
      vars:
        ss_sub_task: restore_key

    - name: "6a.2 → helm install"
      ansible.builtin.include_role:
        name: sealed-secrets
      vars:
        ss_sub_task: helm

    - name: "6a.3 → verify"
      ansible.builtin.include_role:
        name: sealed-secrets
      vars:
        ss_sub_task: verify
