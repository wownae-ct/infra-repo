[defaults]
# inventory를 일부러 비워둠
# -i 누락 시 에러로 사고 방지 (hyperv vs proxmox 혼동).
roles_path = ./roles
host_key_checking = False
retry_files_enabled = False
stdout_callback = yaml
forks = 10
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible-facts
fact_caching_timeout = 3600

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30 -o IdentityAgent=${SSH_AUTH_SOCK} -o AddKeysToAgent=yes
