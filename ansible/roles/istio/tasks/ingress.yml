---
# ============================================================
# istio/tasks/ingress.yml — sub-task 3
# ============================================================
# 대상: k8s-master-01
# istio/gateway chart 설치 (ingressgateway Deployment + Service).
# 사전조건: istiod sub-task 완료 (webhook ready).
#
# 결과: istio-ingressgateway Service 가 MetalLB 로부터 10.98.1.250 할당받음.
# ============================================================

# ------------------------------------------------------------
# 1. values.yaml 렌더
# ------------------------------------------------------------
- name: "ingress | Render values.yaml"
  ansible.builtin.template:
    src: values/ingress.yaml.j2
    dest: /etc/kubernetes/istio-ingress-values.yaml
    owner: root
    group: root
    mode: '0644'
    backup: true

# ------------------------------------------------------------
# 2. 멱등성 판정
# ------------------------------------------------------------
- name: "ingress | Check current release status"
  ansible.builtin.command:
    cmd: >
      helm status {{ istio_ingress_release_name }}
      --namespace {{ istio_namespace }}
      --kubeconfig {{ istio_kubeconfig }}
      -o json
  register: _ingress_status
  changed_when: false
  failed_when: false

- name: "ingress | Get current values (if release exists)"
  ansible.builtin.command:
    cmd: >
      helm get values {{ istio_ingress_release_name }}
      --namespace {{ istio_namespace }}
      --kubeconfig {{ istio_kubeconfig }}
      -o yaml
  register: _ingress_cur_values
  changed_when: false
  failed_when: false
  when: _ingress_status.rc == 0

- name: "ingress | Read rendered values file"
  ansible.builtin.slurp:
    src: /etc/kubernetes/istio-ingress-values.yaml
  register: _ingress_rendered

- name: "ingress | Decide if install/upgrade is needed"
  ansible.builtin.set_fact:
    _ingress_install_needed: >-
      {{
        _ingress_status.rc != 0
        or (_ingress_cur_values.stdout | default('') | from_yaml | default({}))
           != (_ingress_rendered.content | b64decode | from_yaml)
      }}

# ------------------------------------------------------------
# 3. helm install (or upgrade)
# ------------------------------------------------------------
- name: "ingress | helm upgrade --install {{ istio_ingress_release_name }} {{ istio_chart_version }}"
  ansible.builtin.command:
    cmd: >
      helm upgrade --install {{ istio_ingress_release_name }} {{ istio_ingress_chart }}
      --version {{ istio_chart_version }}
      --namespace {{ istio_namespace }}
      --values /etc/kubernetes/istio-ingress-values.yaml
      --wait
      --timeout 10m
      --kubeconfig {{ istio_kubeconfig }}
  register: _helm_out
  when: _ingress_install_needed | bool
  changed_when: true

- name: "ingress | Show helm output (last 20 lines)"
  ansible.builtin.debug:
    msg: "{{ _helm_out.stdout_lines[-20:] }}"
  when:
    - _ingress_install_needed | bool
    - _helm_out.stdout_lines is defined

# ------------------------------------------------------------
# 4. Deployment Ready
# ------------------------------------------------------------
- name: "ingress | Wait for ingressgateway Deployment Available"
  ansible.builtin.command:
    cmd: >
      kubectl --kubeconfig={{ istio_kubeconfig }}
      -n {{ istio_namespace }}
      wait --for=condition=Available deployment/{{ istio_ingress_release_name }}
      --timeout={{ istio_wait_timeout }}
  changed_when: false

# ------------------------------------------------------------
# 5. LB IP 할당 확인 (verify 에서 한 번 더 단언, 여기선 wait)
# ------------------------------------------------------------
- name: "ingress | Wait for LoadBalancer IP assignment"
  ansible.builtin.shell: |
    kubectl --kubeconfig={{ istio_kubeconfig }} \
      -n {{ istio_namespace }} \
      get svc {{ istio_ingress_release_name }} \
      -o jsonpath='{.status.loadBalancer.ingress[0].ip}'
  args:
    executable: /bin/bash
  register: _lb_ip
  changed_when: false
  retries: 20
  delay: 6
  until: _lb_ip.stdout | trim | length > 0

- name: "ingress | Report assigned LB IP"
  ansible.builtin.debug:
    msg: "ingressgateway Service LB IP = {{ _lb_ip.stdout }} (expect {{ istio_ingress_lb_ip }})"
