---
# ============================================================
# istio/tasks/base.yml — sub-task 1
# ============================================================
# 대상: k8s-master-01
# istio/base chart 설치 (CRDs + 기본 ServiceAccount/RBAC).
# 다음 sub-task (istiod, ingress) 의 사전조건.
# ============================================================

# ------------------------------------------------------------
# 1. namespace 보장
# ------------------------------------------------------------
- name: "base | Ensure namespace {{ istio_namespace }} exists"
  ansible.builtin.shell: |
    kubectl --kubeconfig={{ istio_kubeconfig }} \
      create namespace {{ istio_namespace }} \
      --dry-run=client -o yaml | \
    kubectl --kubeconfig={{ istio_kubeconfig }} apply -f -
  args:
    executable: /bin/bash
  register: _ns_apply
  changed_when: "'created' in _ns_apply.stdout"

# ------------------------------------------------------------
# 2. helm repo 등록 / 업데이트
# ------------------------------------------------------------
- name: "base | Add istio helm repo"
  ansible.builtin.command:
    cmd: "helm repo add {{ istio_helm_repo_name }} {{ istio_helm_repo_url }}"
  register: _repo_add
  changed_when: "'has been added' in _repo_add.stdout"
  failed_when:
    - _repo_add.rc != 0
    - "'already exists' not in _repo_add.stderr"

- name: "base | Update repo"
  ansible.builtin.command:
    cmd: "helm repo update {{ istio_helm_repo_name }}"
  changed_when: false

# ------------------------------------------------------------
# 3. values.yaml 렌더
# ------------------------------------------------------------
- name: "base | Render values.yaml"
  ansible.builtin.template:
    src: values/base.yaml.j2
    dest: /etc/kubernetes/istio-base-values.yaml
    owner: root
    group: root
    mode: '0644'
    backup: true

# ------------------------------------------------------------
# 4. 멱등성 판정
# ------------------------------------------------------------
- name: "base | Check current release status"
  ansible.builtin.command:
    cmd: >
      helm status {{ istio_base_release_name }}
      --namespace {{ istio_namespace }}
      --kubeconfig {{ istio_kubeconfig }}
      -o json
  register: _base_status
  changed_when: false
  failed_when: false

- name: "base | Get current values (if release exists)"
  ansible.builtin.command:
    cmd: >
      helm get values {{ istio_base_release_name }}
      --namespace {{ istio_namespace }}
      --kubeconfig {{ istio_kubeconfig }}
      -o yaml
  register: _base_cur_values
  changed_when: false
  failed_when: false
  when: _base_status.rc == 0

- name: "base | Read rendered values file"
  ansible.builtin.slurp:
    src: /etc/kubernetes/istio-base-values.yaml
  register: _base_rendered

- name: "base | Decide if install/upgrade is needed"
  ansible.builtin.set_fact:
    _base_install_needed: >-
      {{
        _base_status.rc != 0
        or (_base_cur_values.stdout | default('') | from_yaml | default({}))
           != (_base_rendered.content | b64decode | from_yaml)
      }}

# ------------------------------------------------------------
# 5. helm install (or upgrade)
# ------------------------------------------------------------
- name: "base | helm upgrade --install {{ istio_base_release_name }} {{ istio_chart_version }}"
  ansible.builtin.command:
    cmd: >
      helm upgrade --install {{ istio_base_release_name }} {{ istio_base_chart }}
      --version {{ istio_chart_version }}
      --namespace {{ istio_namespace }}
      --values /etc/kubernetes/istio-base-values.yaml
      --wait
      --timeout 5m
      --kubeconfig {{ istio_kubeconfig }}
  register: _helm_out
  when: _base_install_needed | bool
  changed_when: true

- name: "base | Show helm output (last 20 lines)"
  ansible.builtin.debug:
    msg: "{{ _helm_out.stdout_lines[-20:] }}"
  when:
    - _base_install_needed | bool
    - _helm_out.stdout_lines is defined

# ------------------------------------------------------------
# 6. CRD 등록 확인 (다음 sub-task 사전조건)
# ------------------------------------------------------------
- name: "base | Wait for Istio CRDs to be Established"
  ansible.builtin.command:
    cmd: >
      kubectl --kubeconfig={{ istio_kubeconfig }}
      wait --for=condition=Established
      crd/{{ item }}.networking.istio.io
      --timeout=60s
  loop:
    - gateways
    - virtualservices
    - destinationrules
    - serviceentries
  changed_when: false

- name: "base | Wait for telemetry CRD"
  ansible.builtin.command:
    cmd: >
      kubectl --kubeconfig={{ istio_kubeconfig }}
      wait --for=condition=Established
      crd/telemetries.telemetry.istio.io
      --timeout=60s
  changed_when: false
