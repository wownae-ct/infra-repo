---
# ============================================================
# kube-prometheus-stack role - defaults
# ============================================================
# kube-prometheus-stack chart 부트스트랩 (Prometheus + Alertmanager
# + Grafana + node-exporter + kube-state-metrics + prometheus-operator).
#
# 백업 환경 분석:
#   - chart : kube-prometheus-stack 83.6.0 (app v0.90.1)
#   - namespace : monitoring
#   - PVCs:
#       prometheus  → 10Gi (Longhorn)
#       grafana     → 2Gi  (Longhorn)
#       alertmanager → 2Gi (Longhorn)
#   - alertmanager: AWS SNS sigv4 (vault credential)
#   - grafana admin: SealedSecret (grafana-admin-secret) — extras 가 적용
#   - 다음 sync 시 prometheus / grafana child Application 자동으로 Synced
#
# etcd metrics:
#   - kubeadm-config.yaml.j2 의 etcd.extraArgs (listen-metrics-urls=0.0.0.0:2381)
#   - 신환경 재구축 시 자동 반영
#   - 이미 떠있는 클러스터의 보정은 별도 작업으로 처리
#
# 디자인:
#   - helm   : namespace + repo + values 렌더 + 멱등성 판정 + install + CRD wait
#   - verify : 컴포넌트 Pods Ready + CRDs + PVC bound + etcd endpoint 응답
# ============================================================

# ============================================================
# Helm release / chart
# ============================================================
kps_helm_repo_name: "prometheus-community"
kps_helm_repo_url: "https://prometheus-community.github.io/helm-charts"

kps_helm_release_name: "kube-prometheus-stack"
kps_helm_chart: "prometheus-community/kube-prometheus-stack"
kps_helm_chart_version: "83.6.0"          # app v0.90.1 (백업 환경과 동일)
kps_namespace: "monitoring"

# kubeconfig
kps_kubeconfig: "/etc/kubernetes/admin.conf"

# ============================================================
# AWS SNS credential (Alertmanager sigv4)
# ============================================================
# values.yaml.j2 에서 jinja2 변수로 주입.
# 노출 방지: values 파일 권한 0600 + no_log
kps_aws_access_key: "{{ vault_aws_access_key }}"
kps_aws_secret_key: "{{ vault_aws_secret_key }}"
kps_aws_region: "ap-northeast-2"
kps_aws_topic_arn: "arn:aws:sns:ap-northeast-2:<aws-account-id>:k8s-cluster-alerts"

# ============================================================
# etcd endpoints (kubeEtcd ServiceMonitor 대상)
# ============================================================
# host_vars 의 k8s_node_ip 그대로 사용. master 노드 3대.
# 신환경에서 IP 가 다르면 host_vars 만 바꾸면 됨.
kps_etcd_endpoints: "{{ groups['k8s_masters'] | map('extract', hostvars, 'k8s_node_ip') | list }}"

# ============================================================
# Verify
# ============================================================
kps_wait_timeout: "600s"          # 첫 install 시간 길어 길게 (CRD apply + image pull)

kps_components_deployments:
  - "{{ kps_helm_release_name }}-operator"
  - "{{ kps_helm_release_name }}-kube-state-metrics"
  - "{{ kps_helm_release_name }}-grafana"

kps_components_statefulsets:
  - "prometheus-{{ kps_helm_release_name }}-prometheus"
  - "alertmanager-{{ kps_helm_release_name }}-alertmanager"

kps_components_daemonsets:
  - "{{ kps_helm_release_name }}-prometheus-node-exporter"

kps_expected_crds:
  - "alertmanagers.monitoring.coreos.com"
  - "alertmanagerconfigs.monitoring.coreos.com"
  - "podmonitors.monitoring.coreos.com"
  - "probes.monitoring.coreos.com"
  - "prometheuses.monitoring.coreos.com"
  - "prometheusagents.monitoring.coreos.com"
  - "prometheusrules.monitoring.coreos.com"
  - "scrapeconfigs.monitoring.coreos.com"
  - "servicemonitors.monitoring.coreos.com"
  - "thanosrulers.monitoring.coreos.com"
