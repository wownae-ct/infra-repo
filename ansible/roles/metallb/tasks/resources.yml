---
# ============================================================
# metallb/tasks/resources.yml — sub-task 2
# ============================================================
# IPAddressPool + L2Advertisement apply.
# helm sub-task 후에 실행 (CRD 가 등록되어 있어야 함).
# ============================================================

# ------------------------------------------------------------
# 1. IPAddressPool
# ------------------------------------------------------------
- name: "resources | Render IPAddressPool manifest"
  ansible.builtin.template:
    src: ipaddresspool.yaml.j2
    dest: /etc/kubernetes/metallb-ipaddresspool.yaml
    owner: root
    group: root
    mode: '0644'

- name: "resources | Apply IPAddressPool"
  ansible.builtin.shell: |
    kubectl --kubeconfig={{ metallb_kubeconfig }} \
      apply -f /etc/kubernetes/metallb-ipaddresspool.yaml
  args:
    executable: /bin/bash
  register: _ipool_apply
  changed_when: >-
    'created' in _ipool_apply.stdout
    or 'configured' in _ipool_apply.stdout

# ------------------------------------------------------------
# 2. L2Advertisement
# ------------------------------------------------------------
- name: "resources | Render L2Advertisement manifest"
  ansible.builtin.template:
    src: l2advertisement.yaml.j2
    dest: /etc/kubernetes/metallb-l2advertisement.yaml
    owner: root
    group: root
    mode: '0644'

- name: "resources | Apply L2Advertisement"
  ansible.builtin.shell: |
    kubectl --kubeconfig={{ metallb_kubeconfig }} \
      apply -f /etc/kubernetes/metallb-l2advertisement.yaml
  args:
    executable: /bin/bash
  register: _l2adv_apply
  changed_when: >-
    'created' in _l2adv_apply.stdout
    or 'configured' in _l2adv_apply.stdout
