---
# ============================================================
# metallb/tasks/helm.yml — sub-task 1
# ============================================================
# metallb chart 설치 (controller + speaker).
# sealed-secrets 의 helm task 와 같은 패턴 (멱등성 강화).
# ============================================================

# ------------------------------------------------------------
# 1. namespace 보장
# ------------------------------------------------------------
- name: "helm | Ensure namespace {{ metallb_namespace }} exists"
  ansible.builtin.shell: |
    kubectl --kubeconfig={{ metallb_kubeconfig }} \
      create namespace {{ metallb_namespace }} \
      --dry-run=client -o yaml | \
    kubectl --kubeconfig={{ metallb_kubeconfig }} apply -f -
  args:
    executable: /bin/bash
  register: _ns_apply
  changed_when: "'created' in _ns_apply.stdout"

# ------------------------------------------------------------
# 2. helm repo 등록 / 업데이트
# ------------------------------------------------------------
- name: "helm | Add metallb repo"
  ansible.builtin.command:
    cmd: "helm repo add {{ metallb_helm_repo_name }} {{ metallb_helm_repo_url }}"
  register: _repo_add
  changed_when: "'has been added' in _repo_add.stdout"
  failed_when:
    - _repo_add.rc != 0
    - "'already exists' not in _repo_add.stderr"

- name: "helm | Update repo"
  ansible.builtin.command:
    cmd: "helm repo update {{ metallb_helm_repo_name }}"
  changed_when: false

# ------------------------------------------------------------
# 3. values.yaml 렌더
# ------------------------------------------------------------
- name: "helm | Render values.yaml"
  ansible.builtin.template:
    src: values.yaml.j2
    dest: /etc/kubernetes/metallb-values.yaml
    owner: root
    group: root
    mode: '0644'
    backup: true

# ------------------------------------------------------------
# 4. 멱등성 판정
# ------------------------------------------------------------
- name: "helm | Check current release status"
  ansible.builtin.command:
    cmd: >
      helm status {{ metallb_helm_release_name }}
      --namespace {{ metallb_namespace }}
      --kubeconfig {{ metallb_kubeconfig }}
      -o json
  register: _metallb_status
  changed_when: false
  failed_when: false

- name: "helm | Get current values (if release exists)"
  ansible.builtin.command:
    cmd: >
      helm get values {{ metallb_helm_release_name }}
      --namespace {{ metallb_namespace }}
      --kubeconfig {{ metallb_kubeconfig }}
      -o yaml
  register: _metallb_cur_values
  changed_when: false
  failed_when: false
  when: _metallb_status.rc == 0

- name: "helm | Read rendered values file"
  ansible.builtin.slurp:
    src: /etc/kubernetes/metallb-values.yaml
  register: _metallb_rendered

- name: "helm | Decide if install/upgrade is needed"
  ansible.builtin.set_fact:
    _metallb_install_needed: >-
      {{
        _metallb_status.rc != 0
        or (_metallb_cur_values.stdout | default('') | from_yaml | default({}))
           != (_metallb_rendered.content | b64decode | from_yaml)
      }}

# ------------------------------------------------------------
# 5. helm install (or upgrade)
# ------------------------------------------------------------
- name: "helm | helm upgrade --install {{ metallb_helm_release_name }} {{ metallb_helm_chart_version }}"
  ansible.builtin.command:
    cmd: >
      helm upgrade --install {{ metallb_helm_release_name }} {{ metallb_helm_chart }}
      --version {{ metallb_helm_chart_version }}
      --namespace {{ metallb_namespace }}
      --values /etc/kubernetes/metallb-values.yaml
      --wait
      --timeout 5m
      --kubeconfig {{ metallb_kubeconfig }}
  register: _helm_out
  when: _metallb_install_needed | bool
  changed_when: true

- name: "helm | Show helm output (last 20 lines)"
  ansible.builtin.debug:
    msg: "{{ _helm_out.stdout_lines[-20:] }}"
  when:
    - _metallb_install_needed | bool
    - _helm_out.stdout_lines is defined

# ------------------------------------------------------------
# 6. CRD 가 등록되었는지 확인 (다음 sub-task resources 의 사전조건)
# ------------------------------------------------------------
- name: "helm | Wait for IPAddressPool CRD to be established"
  ansible.builtin.command:
    cmd: >
      kubectl --kubeconfig={{ metallb_kubeconfig }}
      wait --for=condition=Established
      crd/ipaddresspools.metallb.io
      --timeout=60s
  changed_when: false

- name: "helm | Wait for L2Advertisement CRD to be established"
  ansible.builtin.command:
    cmd: >
      kubectl --kubeconfig={{ metallb_kubeconfig }}
      wait --for=condition=Established
      crd/l2advertisements.metallb.io
      --timeout=60s
  changed_when: false
