---
# ============================================================
# sealed-secrets/tasks/helm.yml — sub-task 2
# ============================================================
# helm 으로 sealed-secrets chart 설치.
# k8s/cilium 에서 쓴 멱등성 패턴 동일:
#   - helm status 로 release 존재 확인
#   - helm get values 로 현재 values 비교
#   - 변경 필요할 때만 helm upgrade --install
# ============================================================

# ------------------------------------------------------------
# 1. helm repo 등록 / 업데이트
# ------------------------------------------------------------
- name: "helm | Add sealed-secrets repo"
  ansible.builtin.command:
    cmd: "helm repo add {{ ss_helm_repo_name }} {{ ss_helm_repo_url }}"
  register: _repo_add
  changed_when: "'has been added' in _repo_add.stdout"
  failed_when:
    - _repo_add.rc != 0
    - "'already exists' not in _repo_add.stderr"

- name: "helm | Update helm repo"
  ansible.builtin.command:
    cmd: "helm repo update {{ ss_helm_repo_name }}"
  changed_when: false

# ------------------------------------------------------------
# 2. values.yaml 렌더
# ------------------------------------------------------------
- name: "helm | Render values.yaml"
  ansible.builtin.template:
    src: values.yaml.j2
    dest: /etc/kubernetes/sealed-secrets-values.yaml
    owner: root
    group: root
    mode: '0644'
    backup: true

# ------------------------------------------------------------
# 3. 멱등성 판정 — release 상태 + values diff
# ------------------------------------------------------------
- name: "helm | Check current release status"
  ansible.builtin.command:
    cmd: >
      helm status {{ ss_helm_release_name }}
      --namespace {{ ss_namespace }}
      --kubeconfig {{ ss_kubeconfig }}
      -o json
  register: _ss_status
  changed_when: false
  failed_when: false

- name: "helm | Get current values (if release exists)"
  ansible.builtin.command:
    cmd: >
      helm get values {{ ss_helm_release_name }}
      --namespace {{ ss_namespace }}
      --kubeconfig {{ ss_kubeconfig }}
      -o yaml
  register: _ss_cur_values
  changed_when: false
  failed_when: false
  when: _ss_status.rc == 0

- name: "helm | Read rendered values file"
  ansible.builtin.slurp:
    src: /etc/kubernetes/sealed-secrets-values.yaml
  register: _ss_rendered

- name: "helm | Decide if install/upgrade is needed"
  ansible.builtin.set_fact:
    _ss_install_needed: >-
      {{
        _ss_status.rc != 0
        or (_ss_cur_values.stdout | default('') | from_yaml | default({}))
           != (_ss_rendered.content | b64decode | from_yaml)
      }}

# ------------------------------------------------------------
# 4. helm install (or upgrade)
# ------------------------------------------------------------
- name: "helm | helm upgrade --install {{ ss_helm_release_name }} {{ ss_helm_chart_version }}"
  ansible.builtin.command:
    cmd: >
      helm upgrade --install {{ ss_helm_release_name }} {{ ss_helm_chart }}
      --version {{ ss_helm_chart_version }}
      --namespace {{ ss_namespace }}
      --values /etc/kubernetes/sealed-secrets-values.yaml
      --wait
      --timeout 5m
      --kubeconfig {{ ss_kubeconfig }}
  register: _helm_out
  when: _ss_install_needed | bool
  changed_when: true

- name: "helm | Show helm output (last 20 lines)"
  ansible.builtin.debug:
    msg: "{{ _helm_out.stdout_lines[-20:] }}"
  when:
    - _ss_install_needed | bool
    - _helm_out.stdout_lines is defined
