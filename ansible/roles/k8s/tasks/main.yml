---
# ============================================================
# roles/k8s/tasks/main.yml — sub-task router
# ============================================================
# 외부(playbook)에서 k8s_sub_task 변수를 지정해 진입한다.
#
# 호출 예시:
#   - hosts: k8s_cluster
#     roles:
#       - role: k8s
#         vars:
#           k8s_sub_task: common
#
# 또는 한 play 안에서 여러 sub-task를 순차 실행할 때:
#   - hosts: k8s_cluster
#     tasks:
#       - include_role: { name: k8s }
#         vars: { k8s_sub_task: common }
#       - include_role: { name: k8s }
#         vars: { k8s_sub_task: containerd }
#
# 허용된 sub-task (사양표의 8개와 1:1):
#   common         : swap off + kernel modules + sysctl       (k8s_cluster, 6대)
#   containerd     : containerd 설치 + SystemdCgroup=true     (k8s_cluster)
#   kube_packages  : kubelet/kubeadm/kubectl 1.34.8 + hold    (k8s_cluster)
#   ha             : keepalived + haproxy                     (k8s_masters)
#   bootstrap      : kubeadm init (VIP:8443)                  (k8s-master-01)
#   join_cp        : control-plane join                       (k8s-master-02,03)
#   join_worker    : worker join                              (k8s_workers)
#   cilium         : helm install cilium 1.19.1               (k8s-master-01)
# ============================================================

- name: "k8s | Assert k8s_sub_task is provided and valid"
  ansible.builtin.assert:
    that:
      - k8s_sub_task is defined
      - k8s_sub_task in _k8s_sub_tasks_allowed
    fail_msg: >-
      k8s_sub_task must be one of: {{ _k8s_sub_tasks_allowed | join(', ') }}
      (got: {{ k8s_sub_task | default('UNDEFINED') }})
    quiet: true
  vars:
    _k8s_sub_tasks_allowed:
      - common
      - containerd
      - kube_packages
      - ha
      - bootstrap
      - join_cp
      - join_worker
      - cilium

- name: "k8s | Include sub-task → {{ k8s_sub_task }}"
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/{{ k8s_sub_task }}.yml"
