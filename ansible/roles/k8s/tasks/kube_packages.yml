---
# ============================================================
# roles/k8s/tasks/kube_packages.yml — sub-task 3
# ============================================================
# 대상: k8s_cluster (6대)
# 호출: include_role: { name: k8s } vars: { k8s_sub_task: kube_packages }
#
# kubelet/kubeadm/kubectl 1.34.8 을 apt 로 설치하고 hold 로 고정.
# pkgs.k8s.io 의 v1.34 repo 사용 (k8s 공식, minor 버전마다 별도 repo).
# ============================================================

# ------------------------------------------------------------
# 1. /etc/apt/keyrings 디렉토리 보장
# ------------------------------------------------------------
- name: "kube_packages | Ensure /etc/apt/keyrings exists"
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: '0755'

# ------------------------------------------------------------
# 2. Kubernetes GPG key
# ------------------------------------------------------------
# pkgs.k8s.io 가 제공하는 키. ASCII armor 형태로 받아서 dearmor 로 .gpg 변환.
# (signed-by 옵션이 .gpg 바이너리 keyring 을 요구)
- name: "kube_packages | Download Kubernetes GPG key (ASCII armor)"
  ansible.builtin.get_url:
    url: "{{ k8s_apt_repo_key_url }}"
    dest: /tmp/kubernetes-apt.asc
    mode: '0644'
    force: true

- name: "kube_packages | Dearmor → {{ k8s_apt_keyring_path }}"
  ansible.builtin.command:
    cmd: "gpg --dearmor --yes -o {{ k8s_apt_keyring_path }} /tmp/kubernetes-apt.asc"
    creates: "{{ k8s_apt_keyring_path }}"

- name: "kube_packages | Set keyring permissions"
  ansible.builtin.file:
    path: "{{ k8s_apt_keyring_path }}"
    owner: root
    group: root
    mode: '0644'

# ------------------------------------------------------------
# 3. apt repo 등록
# ------------------------------------------------------------
- name: "kube_packages | Add Kubernetes apt repo ({{ k8s_version_minor }})"
  ansible.builtin.apt_repository:
    repo: "deb [signed-by={{ k8s_apt_keyring_path }}] {{ k8s_apt_repo_url }}"
    filename: kubernetes
    state: present
    update_cache: true

# ------------------------------------------------------------
# 4. 현재 설치된 kube 패키지 버전 확인
# ------------------------------------------------------------
# 이미 설치되어 있고 버전이 맞으면 unhold/install/hold 사이클을 건너뛴다.
# (dpkg_selections 가 매번 변경으로 잡혀 멱등성이 깨지는 것을 방지)
- name: "kube_packages | Query installed kubelet version"
  ansible.builtin.shell: |
    set -o pipefail
    dpkg-query -W -f='${Version}' kubelet 2>/dev/null || echo "NOT_INSTALLED"
  args:
    executable: /bin/bash
  register: _installed_kubelet
  changed_when: false

- name: "kube_packages | Decide if install is needed"
  ansible.builtin.set_fact:
    _kube_install_needed: "{{ _installed_kubelet.stdout != k8s_version }}"

# ------------------------------------------------------------
# 5. 설치가 필요할 때만: unhold → install → hold
# ------------------------------------------------------------
- name: "kube_packages | Unhold before install (only when version mismatch)"
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: install
  loop: "{{ k8s_kube_packages_names }}"
  when: _kube_install_needed | bool
  failed_when: false

- name: "kube_packages | Install kubelet/kubeadm/kubectl = {{ k8s_version }}"
  ansible.builtin.apt:
    name: "{{ k8s_kube_packages }}"
    state: present
    update_cache: true
    allow_downgrade: true
  when: _kube_install_needed | bool

- name: "kube_packages | Hold kubelet/kubeadm/kubectl (only when changed)"
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop: "{{ k8s_kube_packages_names }}"
  when: _kube_install_needed | bool

# ------------------------------------------------------------
# 6. apt hold (실수로 업그레이드되는 사고 방지)
# ------------------------------------------------------------
- name: "kube_packages | Hold kubelet/kubeadm/kubectl"
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop: "{{ k8s_kube_packages_names }}"

# ------------------------------------------------------------
# 7. kubelet enable (start 는 kubeadm init/join 이 알아서 함)
# ------------------------------------------------------------
- name: "kube_packages | Enable kubelet"
  ansible.builtin.systemd:
    name: kubelet
    enabled: true
    daemon_reload: true
  # state: started 를 의도적으로 빼둠 — init/join 전엔 어차피 crashloop.

# ------------------------------------------------------------
# 8. 검증
# ------------------------------------------------------------
- name: "kube_packages | Verify | kubeadm version"
  ansible.builtin.command: kubeadm version -o short
  register: _v_kubeadm
  changed_when: false
  failed_when: _v_kubeadm.stdout != k8s_version_short

- name: "kube_packages | Verify | kubectl version"
  ansible.builtin.command: kubectl version --client -o yaml
  register: _v_kubectl
  changed_when: false
  failed_when: k8s_version_short not in _v_kubectl.stdout

- name: "kube_packages | Verify | all 3 packages held"
  ansible.builtin.shell: |
    set -o pipefail
    dpkg --get-selections | awk '/^(kubelet|kubeadm|kubectl)\s+hold$/' | wc -l
  args:
    executable: /bin/bash
  register: _v_hold
  changed_when: false
  failed_when: (_v_hold.stdout | int) != 3

- name: "kube_packages | Verify | kubelet enabled"
  ansible.builtin.command: systemctl is-enabled kubelet
  register: _v_kubelet_en
  changed_when: false
  failed_when: _v_kubelet_en.stdout != "enabled"
