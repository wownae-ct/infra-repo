---
# ============================================================
# db role - grants sub-task
# ============================================================
# MariaDB 데이터베이스 + 유저 + 권한.
# 비밀번호 해시 그대로 재사용 (백업).
#
# 의존성:
#   - packages.yml: python3-pymysql
#   - mariadb.yml: mariadb 서비스 active
# ============================================================

# ---------- 데이터베이스 ----------

- name: Ensure databases exist
  community.mysql.mysql_db:
    name: "{{ item }}"
    state: present
    encoding: "{{ db_mariadb_character_set_server }}"
    collation: "{{ db_mariadb_collation_server }}"
    login_unix_socket: /run/mysqld/mysqld.sock
  become: true
  loop: "{{ db_mariadb_databases }}"
  loop_control:
    label: "{{ item }}"
  tags: [db, grants, databases]

# ---------- 유저 / 권한 ----------
# encrypted: true → password_hash 를 그대로 사용 (앞에 '*' 붙은 mysql_native_password)

- name: Ensure MariaDB users and grants
  community.mysql.mysql_user:
    name: "{{ item.name }}"
    host: "{{ item.host }}"
    password: "{{ item.password_hash }}"
    encrypted: true
    priv: "{{ item.priv }}"
    state: present
    login_unix_socket: /run/mysqld/mysqld.sock
  become: true
  loop: "{{ db_mariadb_users }}"
  loop_control:
    label: "{{ item.name }}@{{ item.host }}"
  no_log: true   # 해시 노출 방지
  tags: [db, grants, users]

# ---------- 검증 ----------

- name: Verify - 데이터베이스 존재 확인
  ansible.builtin.shell: |
    mariadb -N -e "SHOW DATABASES LIKE '{{ item }}';"
  args:
    executable: /bin/bash
  become: true
  loop: "{{ db_mariadb_databases }}"
  loop_control:
    label: "{{ item }}"
  register: db_check
  changed_when: false
  failed_when: db_check.stdout != item
  when: not ansible_check_mode
  tags: [db, grants, verify]

- name: Verify - 유저 존재 확인
  ansible.builtin.shell: |
    mariadb -N -e "SELECT COUNT(*) FROM mysql.user WHERE User='{{ item.name }}' AND Host='{{ item.host }}';"
  args:
    executable: /bin/bash
  become: true
  loop: "{{ db_mariadb_users }}"
  loop_control:
    label: "{{ item.name }}@{{ item.host }}"
  register: user_check
  changed_when: false
  failed_when: user_check.stdout != "1"
  when: not ansible_check_mode
  tags: [db, grants, verify]
