---
# ============================================================
# argocd/tasks/repo_credentials.yml — sub-task
# ============================================================
# 대상: k8s-master-01
#
# 목적:
#   ArgoCD 가 private GitHub repo (https://github.com/wownae-ct/*) 에 접근할 수 있도록
#   argocd-repo-creds Secret 을 적용한다.
#
# 멱등성:
#   1. 현재 Secret 의 .data 값 추출 (없으면 빈 dict)
#   2. 기대값 (base64 인코딩) 과 비교
#   3. 다르면 apply, 같으면 skip
#
# Secret 적용 후:
#   - ArgoCD repo-server 가 다음 sync 시 자동 인식
#   - URL prefix matching: vault_github_pat 으로 wownae-ct/* 모든 repo 인증
# ============================================================

# ------------------------------------------------------------
# 1. 현재 Secret 의 data 확인
# ------------------------------------------------------------
- name: "repo_credentials | Get current repo-creds Secret data (if exists)"
  ansible.builtin.shell: |
    kubectl --kubeconfig={{ argocd_kubeconfig }} \
      -n {{ argocd_namespace }} \
      get secret {{ argocd_repo_creds_secret_name }} \
      -o jsonpath='{.data}' 2>/dev/null || echo ""
  args:
    executable: /bin/bash
  register: _creds_current
  changed_when: false
  no_log: true

# ------------------------------------------------------------
# 2. 기대 data 계산 (base64)
# ------------------------------------------------------------
- name: "repo_credentials | Compute desired Secret data (base64)"
  ansible.builtin.set_fact:
    _creds_desired:
      type: "{{ argocd_repo_creds_type | b64encode }}"
      url: "{{ argocd_repo_creds_url_prefix | b64encode }}"
      username: "{{ argocd_repo_creds_username | b64encode }}"
      password: "{{ argocd_repo_creds_password | b64encode }}"
  no_log: true

# ------------------------------------------------------------
# 3. 변경 필요 판정
# ------------------------------------------------------------
- name: "repo_credentials | Decide if Secret update is needed"
  ansible.builtin.set_fact:
    _creds_changed: >-
      {{
        _creds_current.stdout | trim | length == 0
        or (_creds_current.stdout | from_json | default({})) != _creds_desired
      }}
  no_log: true

- name: "repo_credentials | Report change status"
  ansible.builtin.debug:
    msg: "repo-creds Secret {{ 'will be updated' if _creds_changed else 'already up-to-date (no change)' }}"

# ------------------------------------------------------------
# 4. Secret apply (변경 있을 때만)
# ------------------------------------------------------------
# ArgoCD 가 인식하려면 label "argocd.argoproj.io/secret-type: repo-creds" 필수
- name: "repo_credentials | Render Secret manifest"
  ansible.builtin.template:
    src: repo-creds.yaml.j2
    dest: /etc/kubernetes/argocd-repo-creds.yaml
    owner: root
    group: root
    mode: '0600'
    backup: true
  when: _creds_changed | bool
  no_log: true

- name: "repo_credentials | Apply Secret"
  ansible.builtin.shell: |
    kubectl --kubeconfig={{ argocd_kubeconfig }} \
      apply -f /etc/kubernetes/argocd-repo-creds.yaml
  args:
    executable: /bin/bash
  register: _creds_apply
  when: _creds_changed | bool
  changed_when: >-
    'created' in _creds_apply.stdout
    or 'configured' in _creds_apply.stdout
  no_log: true

- name: "repo_credentials | Remove temp manifest"
  ansible.builtin.file:
    path: /etc/kubernetes/argocd-repo-creds.yaml
    state: absent
  when: _creds_changed | bool

# ------------------------------------------------------------
# 5. Verify — ArgoCD 가 인식하는지 확인 (label 존재 단언)
# ------------------------------------------------------------
- name: "repo_credentials | Verify Secret has argocd repo-creds label"
  ansible.builtin.shell: |
    kubectl --kubeconfig={{ argocd_kubeconfig }} \
      -n {{ argocd_namespace }} \
      get secret {{ argocd_repo_creds_secret_name }} \
      -o jsonpath='{.metadata.labels.argocd\.argoproj\.io/secret-type}'
  args:
    executable: /bin/bash
  register: _creds_label
  changed_when: false
  failed_when: _creds_label.stdout != 'repo-creds'

- name: "repo_credentials | Report registered prefix"
  ansible.builtin.debug:
    msg: "argocd-repo-creds Secret OK — URL prefix: {{ argocd_repo_creds_url_prefix }}"
