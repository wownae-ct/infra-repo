---
# ============================================================
# longhorn role - defaults
# ============================================================
# Longhorn 분산 블록 스토리지 부트스트랩.
#
# 백업 환경 분석 결과:
#   - chart : longhorn/longhorn v1.11.0 (helm)
#   - 디스크: root path 만 (별도 디스크 미사용) → 신환경은 sda/sdb 30G 활용
#   - backup-target: 미설정 상태 (이번 기회에 R2 로 제대로 설정)
#   - RecurringJob: daily-backup (cron "0 4 * * *", retain 3)
#
# 디자인:
#   - prerequisites : worker 전용 사전준비 (multipath, kernel modules, 패키지,
#                     30G 디스크 ext4 포맷 + 마운트)
#   - helm          : chart install
#   - disks         : Longhorn Node CRD 에 마운트 path 등록
#   - backup        : R2 credential secret + backup-target setting + RecurringJob
#   - verify        : 종합 검증
# ============================================================

# ============================================================
# Helm release / chart
# ============================================================
longhorn_helm_repo_name: "longhorn"
longhorn_helm_repo_url: "https://charts.longhorn.io"

longhorn_helm_release_name: "longhorn"
longhorn_helm_chart: "longhorn/longhorn"
longhorn_helm_chart_version: "1.11.0"      # 백업 환경과 동일 (takeover 위해)
longhorn_namespace: "longhorn-system"

# kubeconfig
longhorn_kubeconfig: "/etc/kubernetes/admin.conf"

# ============================================================
# Worker prerequisites
# ============================================================
# Longhorn 이 노드에서 요구하는 것들:
#   - open-iscsi (iscsid)            : iSCSI initiator
#   - nfs-common                     : NFS client (RWX volume)
#   - cryptsetup, dmsetup            : encrypted volume 지원
#   - multipathd OFF (or blacklist)  : Longhorn volume 충돌 방지
#   - dm_crypt kernel module         : encrypted volume

longhorn_required_packages:
  - open-iscsi
  - nfs-common
  - cryptsetup
  - dmsetup

longhorn_required_kernel_modules:
  - dm_crypt
  - iscsi_tcp

# ============================================================
# Disk mount (worker 노드의 30G 빈 디스크)
# ============================================================
# host_vars 의 k8s_longhorn_disk 에 디스크 path 박혀있음:
#   worker-01 : /dev/sda
#   worker-02 : /dev/sdb
#   worker-03 : /dev/sda
#
# 포맷: ext4 (Longhorn 공식 권장)
# 마운트: /var/lib/longhorn-data
# fstab : UUID 기반 영구 마운트

longhorn_disk_mount_path: "/var/lib/longhorn-data"
longhorn_disk_fstype: "ext4"
longhorn_disk_mount_opts: "defaults,noatime"

# Longhorn Node CRD 의 disk 항목 — storageReserved 는 5GB (충돌 방지)
longhorn_disk_tag_name: "ssd"
longhorn_disk_storage_reserved_bytes: 5368709120   # 5 GiB

# ============================================================
# Chart values
# ============================================================
# 백업 환경은 거의 기본값. 신환경도 default 유지하되 몇 가지 명시:
#   - defaultSettings.defaultReplicaCount: 3 (worker 3대 → 가용성)
#   - defaultSettings.replicaSoftAntiAffinity: true (다른 노드에 복제)
#   - defaultSettings.createDefaultDiskLabeledNodes: false
#     (기본 디스크 자동 생성 안 함 - 우리가 명시적으로 등록)
#   - persistence.defaultClassReplicaCount: 3
#   - ingress 는 ArgoCD App-of-Apps 가 Istio VirtualService 로 따로 설정

longhorn_chart_values:
  defaultSettings:
    defaultReplicaCount: 3
    replicaSoftAntiAffinity: true
    createDefaultDiskLabeledNodes: false   # ★ 핵심: 자동 디스크 안 만듦
    storageMinimalAvailablePercentage: 10
    storageOverProvisioningPercentage: 200
    allowEmptyDiskSelectorVolume: true
    allowEmptyNodeSelectorVolume: true
    backupCompressionMethod: lz4

  persistence:
    defaultClass: true
    defaultClassReplicaCount: 3
    reclaimPolicy: Delete
    defaultFsType: ext4

  longhornManager:
    log:
      format: json

  ingress:
    enabled: false   # Istio VirtualService 로 ArgoCD 가 따로 처리

  # ServiceMonitor (kube-prometheus-stack 이 추후 수집)
  metrics:
    serviceMonitor:
      enabled: false

# ============================================================
# Backup (R2)
# ============================================================
# 분리된 신환경 버킷: jiong-longhorn
# endpoint: vault 변수

longhorn_backup_target: "s3://jiong-longhorn@auto/"
longhorn_backup_secret_name: "longhorn-r2-backup-secret"

# RecurringJob (백업 환경 그대로)
longhorn_recurring_job_name: "daily-backup"
longhorn_recurring_job_groups: ["default"]
longhorn_recurring_job_cron: "0 4 * * *"
longhorn_recurring_job_retain: 3
longhorn_recurring_job_concurrency: 2

# ============================================================
# Verify
# ============================================================
longhorn_wait_timeout: "300s"
